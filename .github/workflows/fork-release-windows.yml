# Fork-only: cada push na main gera o instalador Windows (NSIS x64, sem
# assinatura de código) e o publica como GitHub Release neste repositório.
# Versão: <major>.<minor> do apps/studio + número do run, sem commit de volta.
name: Fork release (Windows)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release-windows
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'renanrmsantos14/RenanDesign'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STUDIO_CLOUD_BUILD: '0'
      # Build de fork sem certificado: scripts/windows-signing.ts exige este opt-in.
      ONLOOK_WINDOWS_ALLOW_UNSIGNED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      STUDIO_UPDATE_FEED: https://github.com/renanrmsantos14/RenanDesign/releases/latest/download/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $parts = (node -p "require('./apps/studio/package.json').version").Split('-')[0].Split('.')
          "version=$($parts[0]).$($parts[1]).${{ github.run_number }}" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        run: bun run build:windows --version ${{ steps.version.outputs.version }}
      - name: Collect release files
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "release/RenanDesign-$v-x64.exe" out
          Get-ChildItem release -File | Where-Object { $_.Name -in @("RenanDesign-$v-x64.exe.blockmap", 'latest.yml') } | Copy-Item -Destination out
          Get-ChildItem out | Select-Object Name, Length
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          {
            echo "## O que há de novo"
            echo
            if [ -n "$prev" ]; then
              changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_SHA" \
                -q '.commits[] | select(.parents | length == 1) | .commit.message | split("\n")[0]' |
                grep -v '^chore(release)' | sed 's/^/- /' || true)
              echo "${changes:-- Sem mudanças de código desde $prev.}"
            else
              echo "- Primeira versão publicada."
            fi
          } > notes.md
          cat notes.md
          # O diálogo de atualização do app lê estas linhas do feed.
          { echo; echo 'releaseNotes: |'; sed 's/^/  /' notes.md; } >> out/latest.yml
          cat out/latest.yml
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = @(Get-ChildItem out -File | ForEach-Object { $_.FullName })
          gh release create "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "RenanDesign $env:VERSION" --notes-file notes.md --latest $files
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
